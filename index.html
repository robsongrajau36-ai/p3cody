<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="description" content="P3cody — estamos construindo. Sistemas, automação e integrações a caminho." />
<title>P3cody — Em construção</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%9B%A0%EF%B8%8F%3C/text%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#070B12;
    --panel:#101B2A;
    --panel-line:rgba(255,255,255,.12);
    --ink:#F5F7FB;
    --ink-soft:#9EABC0;
    --line:rgba(255,255,255,.10);
    --line-strong:rgba(255,255,255,.20);
    --amber:#18F39A;
    --teal:#5CA9FF;
    --font-display:'Space Grotesk','Arial Narrow',sans-serif;
    --font-mono:'IBM Plex Mono','Courier New',monospace;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  @media (prefers-color-scheme: light){
    :root:not([data-theme="dark"]){
      --paper:#F4F7FB; --panel:#101B2A; --panel-line:rgba(255,255,255,.12);
      --ink:#101827; --ink-soft:#5D6B80;
      --line:rgba(15,23,42,.12); --line-strong:rgba(15,23,42,.22);
      --amber:#0E9D68; --teal:#3B7DD8;
    }
  }
  :root[data-theme="light"]{
    --paper:#F4F7FB; --panel:#101B2A; --panel-line:rgba(255,255,255,.12);
    --ink:#101827; --ink-soft:#5D6B80;
    --line:rgba(15,23,42,.12); --line-strong:rgba(15,23,42,.22);
    --amber:#0E9D68; --teal:#3B7DD8;
  }
  :root[data-theme="dark"]{
    --paper:#070B12; --panel:#101B2A; --panel-line:rgba(255,255,255,.12);
    --ink:#F5F7FB; --ink-soft:#9EABC0;
    --line:rgba(255,255,255,.10); --line-strong:rgba(255,255,255,.20);
    --amber:#18F39A; --teal:#5CA9FF;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;font-family:var(--font-mono);color:var(--ink);background:var(--paper);
    display:flex;flex-direction:column;
    background-image:
      radial-gradient(circle at 78% 8%, rgba(24,243,154,.12), transparent 26rem),
      radial-gradient(circle at 8% 88%, rgba(92,169,255,.10), transparent 26rem);
    background-repeat:no-repeat;
  }
  a{color:inherit;text-decoration:none}
  button{cursor:pointer;background:none;border:none;font:inherit;color:inherit;padding:0}
  ::selection{background:rgba(24,243,154,.18)}

  header{padding:22px 6% ;padding-top:calc(22px + env(safe-area-inset-top,0px));display:flex;justify-content:space-between;align-items:center}
  .brand{font-family:var(--font-display);font-weight:700;font-size:1.15rem;letter-spacing:-.02em}
  .brand em{font-style:normal;color:var(--amber)}
  .icon-btn{width:36px;height:36px;border:1px solid var(--line);border-radius:8px;display:grid;place-items:center;background:transparent;color:var(--ink);font-size:.85rem}

  main{flex:1;display:flex;align-items:center;justify-content:center;padding:32px 6% 60px}
  .stage{width:min(560px,100%);text-align:center}
  .kicker{display:flex;align-items:center;justify-content:center;gap:8px;font-size:.78rem;color:var(--ink-soft)}
  .kicker i{width:6px;height:6px;border-radius:50%;background:var(--teal);display:inline-block;animation:pulse 2.2s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

  h1{
    font-family:var(--font-display);font-weight:600;letter-spacing:-.01em;
    font-size:clamp(2rem,7vw,3.1rem);line-height:1.08;margin:20px 0 14px;
  }
  h1 span{color:var(--amber)}
  .lead{font-family:'Space Grotesk',sans-serif;color:var(--ink-soft);font-size:1.02rem;max-width:42ch;margin:0 auto}

  .term{
    margin:38px auto 0;max-width:440px;text-align:left;
    background:var(--panel);border:1px solid var(--panel-line);border-radius:12px;
    box-shadow:0 24px 60px rgba(0,0,0,.35);overflow:hidden;
  }
  .term-bar{display:flex;gap:6px;align-items:center;padding:11px 14px;border-bottom:1px solid var(--panel-line)}
  .term-bar i{width:9px;height:9px;border-radius:50%;background:var(--line-strong)}
  .term-title{margin-left:8px;font-size:.72rem;color:var(--ink-soft)}
  .term-body{padding:18px 16px 22px;font-size:.86rem;min-height:112px}
  .term-line{color:var(--ink-soft);opacity:0;animation:reveal .3s forwards}
  .term-line b{color:var(--teal);font-weight:500}
  .term-line.ok b{color:var(--amber)}
  @keyframes reveal{to{opacity:1}}
  .caret{display:inline-block;width:7px;height:15px;background:var(--amber);vertical-align:middle;margin-left:2px;animation:blink 1s step-end infinite}
  @keyframes blink{50%{opacity:0}}

  .progress-wrap{max-width:440px;margin:16px auto 0;height:3px;background:var(--line);border-radius:99px;overflow:hidden}
  .progress-bar{height:100%;width:0%;background:linear-gradient(90deg,var(--teal),var(--amber));border-radius:99px;animation:grow 6s ease-in-out infinite}
  @keyframes grow{0%{width:8%}50%{width:78%}100%{width:8%}}

  .notify{margin-top:34px;display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
  .field{display:flex;border:1px solid var(--line-strong);border-radius:9px;overflow:hidden;background:var(--panel);width:min(360px,100%)}
  .field input{flex:1;border:none;background:transparent;color:var(--ink);padding:12px 14px;font-family:'Space Grotesk',sans-serif;font-size:.9rem;outline:none}
  .field button{background:var(--amber);color:#06110B;font-weight:600;padding:0 18px;font-family:'Space Grotesk',sans-serif;font-size:.9rem}

  footer{padding:20px 6%;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px));text-align:center;font-size:.76rem;color:var(--ink-soft)}
  footer a{border-bottom:1px solid var(--line-strong)}
  footer a:hover{color:var(--amber);border-color:var(--amber)}

  .toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);
    background:var(--panel);color:var(--ink);border:1px solid var(--panel-line);padding:12px 18px;border-radius:9px;
    font-family:'Space Grotesk',sans-serif;font-size:.86rem;display:none;z-index:20}
  .toast.show{display:block}

  @media(prefers-reduced-motion:reduce){
    *{animation-duration:.001ms !important;animation-iteration-count:1 !important}
  }
</style>
</head>
<body>
  <header>
    <span class="brand">P3<em>cody</em></span>
    <button class="icon-btn" id="themeBtn" aria-label="Alternar tema">◐</button>
  </header>

  <main>
    <div class="stage">
      <div class="kicker"><i></i>sistema em construção</div>
      <h1>Ainda estamos<br><span>montando isso.</span></h1>
      <p class="lead">A P3cody está construindo seus primeiros sistemas de verdade. O site completo volta em breve.</p>

      <div class="term">
        <div class="term-bar"><i></i><i></i><i></i><span class="term-title">build.log</span></div>
        <div class="term-body" id="termBody"></div>
      </div>
      <div class="progress-wrap"><div class="progress-bar"></div></div>

      <div class="notify">
        <form class="field" id="notifyForm">
          <input type="email" id="notifyEmail" placeholder="seu@email.com" required>
          <button type="submit">Avisar</button>
        </form>
      </div>
    </div>
  </main>

  <footer>
    Fale direto: <a href="mailto:contato@p3cody.com">contato@p3cody.com</a>
  </footer>
  <div class="toast" id="toast"></div>

<script>
  const $ = s => document.querySelector(s);

  try{
    const saved = localStorage.getItem('p3cody-theme');
    if(saved) document.documentElement.setAttribute('data-theme', saved);
  }catch(e){}
  $('#themeBtn').addEventListener('click', () => {
    const cur = document.documentElement.getAttribute('data-theme');
    const next = cur === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    try{ localStorage.setItem('p3cody-theme', next); }catch(e){}
  });

  const lines = [
    { html: '<b>$</b> conectando TOTVS RM…', ok:false },
    { html: '<b>$</b> escrevendo rotinas de automação…', ok:false },
    { html: '<b>$</b> desenhando o painel P3 Transport…', ok:false },
    { html: '<b>✓</b> primeira versão a caminho', ok:true }
  ];
  const body = $('#termBody');
  let i = 0;
  function typeLine(){
    if(i >= lines.length){ i = 0; body.innerHTML=''; }
    const el = document.createElement('div');
    el.className = 'term-line' + (lines[i].ok ? ' ok' : '');
    el.innerHTML = lines[i].html;
    body.appendChild(el);
    if(body.children.length > 4) body.removeChild(body.firstChild);
    i++;
  }
  typeLine();
  setInterval(typeLine, 1900);

  function showToast(msg){
    const t = $('#toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 3600);
  }
  $('#notifyForm').addEventListener('submit', e => {
    e.preventDefault();
    const email = $('#notifyEmail').value.trim();
    const subject = encodeURIComponent('Avisar quando o site estiver no ar');
    const body = encodeURIComponent(`Quero ser avisado quando o site da P3cody estiver no ar.\n\nMeu e-mail: ${email}`);
    window.location.href = `mailto:contato@p3cody.com.br?subject=${subject}&body=${body}`;
    showToast('Abrindo seu app de e-mail para confirmar o envio…');
    e.target.reset();
  });
</script>
</body>
</html>
